name: Bug report
description: Report reproducible incorrect behavior in koota-kit.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample, seed values, and exact commands.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: koota-kit, Koota, Node.js, package manager, and operating system.
      placeholder: koota-kit 0.1.1; Koota 0.6.6; Node 24; pnpm 10; macOS 26
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, serialized headers with non-sensitive data, or other useful details.
